# =============================================================================
# Spark 3.5.8 / Scala 2.12  ->  Apache Iceberg  ->  Cloudflare R2 Data Catalog
# =============================================================================
# Deployed to /opt/spark/conf/spark-defaults.conf on:
#   - spark-manager   (cluster master)
#   - spark-worker1, spark-worker2
#   - mypc            (Zeppelin host; acts as the Spark driver)
#
# The driver node needs this file too: the catalog definition lives in the
# driver's SparkSession, not on the workers. Workers only need the JARs.
#
# All secrets are ${PLACEHOLDERS}. See .env.example.
# -----------------------------------------------------------------------------

# --- Dependencies ------------------------------------------------------------
# iceberg-spark-runtime  : Iceberg SQL extensions + SparkCatalog. The 3.5_2.12
#                          suffix MUST match your Spark minor version and Scala
#                          build, or the catalog silently fails to resolve.
# iceberg-aws-bundle     : shaded AWS SDK v2, required by S3FileIO.
# hadoop-aws             : only needed if you also read/write raw s3a:// paths
#                          outside of Iceberg. Safe to drop otherwise.
spark.jars.packages   org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,org.apache.hadoop:hadoop-aws:3.3.4

spark.sql.extensions  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# --- Catalog: "r2" (Cloudflare R2 Data Catalog, an Iceberg REST catalog) ------
spark.sql.defaultCatalog                    r2

spark.sql.catalog.r2                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.r2.type                   rest
spark.sql.catalog.r2.uri                    https://catalog.cloudflarestorage.com/${R2_ACCOUNT_ID}/${R2_BUCKET}
spark.sql.catalog.r2.warehouse              ${R2_ACCOUNT_ID}_${R2_BUCKET}
spark.sql.catalog.r2.io-impl                org.apache.iceberg.aws.s3.S3FileIO

# R2 Data Catalog authenticates with a static API token, not an OAuth2 client
# credentials exchange. Disabling the OAuth flow and setting the Authorization
# header directly is what makes this work.
spark.sql.catalog.r2.rest.auth.type         none
spark.sql.catalog.r2.header.Authorization   Bearer ${R2_CATALOG_TOKEN}

# --- Data file access (S3-compatible, via S3FileIO) --------------------------
# NOTE: these are catalog-scoped `s3.*` properties, NOT `spark.hadoop.fs.s3a.*`.
# S3FileIO does not read the Hadoop s3a settings — a common and confusing
# misconfiguration, because the catalog will connect and list tables fine and
# only fail later when it tries to open a data file.
spark.sql.catalog.r2.s3.endpoint            https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
spark.sql.catalog.r2.s3.access-key-id       ${R2_ACCESS_KEY_ID}
spark.sql.catalog.r2.s3.secret-access-key   ${R2_SECRET_ACCESS_KEY}
spark.sql.catalog.r2.s3.path-style-access   true
spark.sql.catalog.r2.s3.region              auto

# --- Optional: raw s3a:// access, independent of Iceberg ---------------------
# Only uncomment if you read/write non-Iceberg files directly from R2.
# spark.hadoop.fs.s3a.endpoint              https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
# spark.hadoop.fs.s3a.access.key            ${R2_ACCESS_KEY_ID}
# spark.hadoop.fs.s3a.secret.key            ${R2_SECRET_ACCESS_KEY}
# spark.hadoop.fs.s3a.path.style.access     true
# spark.hadoop.fs.s3a.impl                  org.apache.hadoop.fs.s3a.S3AFileSystem
