<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" width="1280" height="920" font-family="Inter, Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="#F8FAFC"/>

  <!-- ══ Header ═══════════════════════════════════════════════════════ -->
  <rect x="0" y="0" width="1280" height="104" fill="#0F172A"/>
  <text x="640" y="47" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">The Three Layers of a Modern Lakehouse</text>
  <text x="640" y="78" text-anchor="middle" font-size="15" fill="#94A3B8">Storage · Catalog · Compute — separated, on open standards, so any engine can join</text>

  <!-- ══ Layer 3: COMPUTE ═════════════════════════════════════════════ -->
  <rect x="150" y="132" width="182" height="30" rx="15" fill="#334155"/>
  <circle cx="169" cy="147" r="11" fill="#FFFFFF"/>
  <text x="169" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">3</text>
  <text x="190" y="152" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.3">COMPUTE</text>
  <text x="346" y="152" font-size="13" fill="#64748B">interchangeable — swap either engine, the data never moves</text>

  <!-- Spark -->
  <rect x="150" y="170" width="480" height="180" rx="12" fill="#FFF3EA" stroke="#EA580C" stroke-width="2"/>
  <text x="176" y="207" font-size="18" font-weight="700" fill="#9A3412">Apache Spark 3.5.8</text>
  <text x="176" y="230" font-size="12.5" fill="#C2410C">Self-managed · Proxmox · 3 × Debian 13 VMs</text>
  <rect x="176" y="242" width="142" height="27" rx="6" fill="#FFFFFF" stroke="#F9A66C" stroke-width="1"/>
  <text x="247" y="260" text-anchor="middle" font-size="11.5" fill="#9A3412">spark-manager</text>
  <rect x="326" y="242" width="138" height="27" rx="6" fill="#FFFFFF" stroke="#F9A66C" stroke-width="1"/>
  <text x="395" y="260" text-anchor="middle" font-size="11.5" fill="#9A3412">spark-worker1</text>
  <rect x="472" y="242" width="138" height="27" rx="6" fill="#FFFFFF" stroke="#F9A66C" stroke-width="1"/>
  <text x="541" y="260" text-anchor="middle" font-size="11.5" fill="#9A3412">spark-worker2</text>
  <rect x="176" y="277" width="228" height="27" rx="6" fill="#FFFFFF" stroke="#F9A66C" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="290" y="295" text-anchor="middle" font-size="11.5" fill="#9A3412">Zeppelin — notebook + driver</text>
  <text x="176" y="330" font-size="12.5" fill="#B45309">Setup: VMs, JVM, classpath, SSH, cluster tuning</text>

  <!-- Snowflake -->
  <rect x="650" y="170" width="480" height="180" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="676" y="207" font-size="18" font-weight="700" fill="#1E40AF">Snowflake</text>
  <text x="676" y="230" font-size="12.5" fill="#1D4ED8">Fully managed · elastic virtual warehouses</text>
  <rect x="676" y="242" width="184" height="27" rx="6" fill="#FFFFFF" stroke="#93B4F8" stroke-width="1"/>
  <text x="768" y="260" text-anchor="middle" font-size="11.5" fill="#1E40AF">EXTERNAL VOLUME</text>
  <rect x="868" y="242" width="212" height="27" rx="6" fill="#FFFFFF" stroke="#93B4F8" stroke-width="1"/>
  <text x="974" y="260" text-anchor="middle" font-size="11.5" fill="#1E40AF">CATALOG INTEGRATION</text>
  <rect x="676" y="277" width="288" height="27" rx="6" fill="#FFFFFF" stroke="#93B4F8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="820" y="295" text-anchor="middle" font-size="11.5" fill="#1E40AF">Catalog-linked database — tables auto-sync</text>
  <text x="676" y="330" font-size="12.5" font-weight="600" fill="#1D4ED8">Setup: 3 SQL statements. That is the whole integration.</text>

  <!-- ══ Converging metadata path ═════════════════════════════════════ -->
  <path d="M 390 350 L 390 382 Q 390 396 406 398 L 626 412 Q 640 414 640 426 L 640 446" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 890 350 L 890 382 Q 890 396 874 398 L 654 412 Q 640 414 640 426" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="672" y="440" font-size="12.5" fill="#475569">Iceberg REST — resolve &amp; commit table metadata</text>

  <!-- ══ Layer 2: CATALOG ═════════════════════════════════════════════ -->
  <rect x="150" y="412" width="176" height="30" rx="15" fill="#7C3AED"/>
  <circle cx="169" cy="427" r="11" fill="#FFFFFF"/>
  <text x="169" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#7C3AED">2</text>
  <text x="190" y="432" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.3">CATALOG</text>
  <text x="340" y="432" font-size="13" fill="#64748B">single source of truth</text>

  <rect x="150" y="450" width="980" height="140" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="640" y="487" text-anchor="middle" font-size="18" font-weight="700" fill="#5B21B6">Cloudflare R2 Data Catalog</text>
  <text x="640" y="512" text-anchor="middle" font-size="13.5" fill="#6D28D9">Apache Iceberg REST — the open protocol both engines speak</text>
  <text x="640" y="537" text-anchor="middle" font-size="12.5" fill="#7C3AED">Tracks which snapshot of each table is current, and commits changes atomically. Every engine asks it; no engine owns it.</text>
  <text x="640" y="566" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8B5CF6">Same REST spec as Polaris, Nessie, Glue and Unity — the catalog itself is swappable.</text>

  <!-- catalog → storage -->
  <path d="M 640 590 L 640 646" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>
  <text x="672" y="624" font-size="12.5" fill="#475569">points to the current data files</text>

  <!-- ══ Layer 1: STORAGE ═════════════════════════════════════════════ -->
  <rect x="150" y="612" width="176" height="30" rx="15" fill="#475569"/>
  <circle cx="169" cy="627" r="11" fill="#FFFFFF"/>
  <text x="169" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">1</text>
  <text x="190" y="632" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.3">STORAGE</text>
  <text x="340" y="632" font-size="13" fill="#64748B">one copy, open format</text>

  <rect x="150" y="650" width="980" height="160" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="640" y="688" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Cloudflare R2 — S3-compatible object storage</text>
  <rect x="180" y="708" width="290" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="325" y="731" text-anchor="middle" font-size="12.5" fill="#334155">Apache Parquet data files</text>
  <rect x="495" y="708" width="290" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="640" y="731" text-anchor="middle" font-size="12.5" fill="#334155">Iceberg manifests &amp; snapshots</text>
  <rect x="810" y="708" width="290" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
  <text x="955" y="731" text-anchor="middle" font-size="12.5" fill="#334155">No proprietary format</text>
  <text x="640" y="776" text-anchor="middle" font-size="12.5" fill="#64748B">One copy of the data. Nothing is duplicated per engine, and nothing is trapped in a vendor's storage.</text>

  <!-- ══ Data-file channels ═══════════════════════════════════════════ -->
  <path d="M 150 262 L 100 262 L 100 730 L 150 730" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#arS)"/>
  <g transform="rotate(-90 86 496)"><rect x="-14" y="484" width="200" height="22" fill="#F8FAFC"/><text x="86" y="500" text-anchor="middle" font-size="12" fill="#475569">read / write data files</text></g>

  <path d="M 1130 262 L 1180 262 L 1180 730 L 1130 730" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)" marker-start="url(#arS)"/>
  <g transform="rotate(-90 1196 496)"><rect x="1096" y="484" width="200" height="22" fill="#F8FAFC"/><text x="1196" y="500" text-anchor="middle" font-size="12" fill="#475569">read / write data files</text></g>

  <!-- ══ Egress banner ════════════════════════════════════════════════ -->
  <rect x="150" y="836" width="980" height="46" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="640" y="864" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46">$0 egress on Cloudflare R2 — every engine reads the same files, and moving bytes between them costs nothing</text>

  <text x="640" y="905" text-anchor="middle" font-size="12" fill="#94A3B8">Solid = Iceberg REST (metadata) · Dashed = S3 API (data files)</text>
</svg>
